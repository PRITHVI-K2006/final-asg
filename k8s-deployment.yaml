apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calculator
  labels:
    app: grade-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-calculator
  template:
    metadata:
      labels:
        app: grade-calculator
    spec:
      containers:
      - name: grade-calculator
        image: prithivi2006/grade-calculator:IMAGE_TAG
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: grade-calculator-service
spec:
  selector:
    app: grade-calculator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
