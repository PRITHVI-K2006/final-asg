name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

  
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-mode: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Automated Tests
      run: |
        pytest test_app.py

  
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ prithivi2006 }}
        password: ${{ T.U.I.S.DOCKER.2019 }}

    - name: Build and Push Docker Image
      run: |
    
        TAG=${{ github.sha }}
        IMAGE_NAME=${{ prithivi2006 }}/grade-calculator:$TAG
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    
    - name: Set up Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Update Image Tag and Deploy
      run: |
        TAG=${{ github.sha }}
       
        sed -i "s|prithivi2006|${{ prithivi2006 }}|g" k8s-deployment.yml
        sed -i "s|IMAGE_TAG|$TAG|g" k8s-deployment.yml
        kubectl apply -f k8s-deployment.yml
